<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Checkout sample (EUR)</title>
    <style>body{font-family:Arial; padding:18px} .panel{max-width:720px;margin:0 auto} label{display:block;margin:8px 0 4px} input, button{padding:8px; width:100%; box-sizing:border-box}</style>
  </head>
  <body>
    <div class="panel">
      <h1>Sample checkout page — European formatting</h1>
      <p>This page simulates a checkout with a European-style total (comma as decimal separator).</p>

      <form id="checkoutForm">
        <label>Full name</label>
        <input name="name" id="name" />

        <label>Street address</label>
        <input name="address" id="address" />

        <label>City</label>
        <input name="city" id="city" />

        <label>Postal code</label>
        <input name="postal" id="postal" />

        <label>Payment</label>
        <!-- simulated payment iframe (stripe) -->
        <iframe src="https://js.stripe.com/v3/" title="Stripe payment frame" style="width:100%;height:120px;border:1px solid #ddd"></iframe>

        <label style="margin-top:12px">Coupon code</label>
        <input name="coupon" />

        <div style="margin-top:12px"><button id="placeOrder">Place your order</button></div>
      </form>

      <!-- European-style visible total to validate parser: '49,95 €' -->
      <div style="max-width:720px;margin:12px auto;padding:8px;border:1px dashed #ddd;font-weight:600;" id="grand-total-eur">49,95 €</div>

    </div>
  </body>
</html>
